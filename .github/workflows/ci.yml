# ci.yml - Tests every pull request and push; after a push to master passes, publishes the two images the cloud VM
# runs (ghcr.io/diantris/rock-collection-api and -frontend, :latest). The VM's deploy/update.sh pulls them within
# 5 minutes, so a merge goes live by itself (deploy/README.md).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rock-collection-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Includes DatabaseIntegrationTest: Testcontainers uses the runner's Docker for Postgres.
      - run: chmod +x mvnw && ./mvnw -B test
        env:
          # Ryuk cleans up leftover containers; the runner is thrown away anyway.
          TESTCONTAINERS_RYUK_DISABLED: true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: rock-collection-backend/target/surefire-reports

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rock-collection-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Yarn 1.22 as pinned in package.json ("packageManager")
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn build

  images:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Built (and checked) on pull requests too, so a broken Dockerfile or Caddyfile never reaches master.
      # Layers are cached between runs; Caddy's plugin build and the dependencies are rarely rebuilt.
      - name: Build the frontend image
        uses: docker/build-push-action@v7
        with:
          context: rock-collection-frontend
          tags: rock-collection-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Check both Caddyfiles
        run: |
          docker run --rm rock-collection-frontend:ci caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e DUCKDNS_DOMAIN=ci -e DUCKDNS_TOKEN=x rock-collection-frontend:ci \
            caddy validate --config /etc/caddy/vm.Caddyfile
      - name: Check the VM's compose file
        run: docker compose -f deploy/docker-compose.yml config -q
        env:
          POSTGRES_PASSWORD: x
          DUCKDNS_DOMAIN: ci
          DUCKDNS_TOKEN: x
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: rock-collection-backend
          tags: rock-collection-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same builds as above, so every layer comes from the cache. The source label links the images to this repo.
      - name: Publish the API image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: rock-collection-backend
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/rock-collection-api:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
      - name: Publish the frontend image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: rock-collection-frontend
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/rock-collection-frontend:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
