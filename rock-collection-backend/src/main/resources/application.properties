# Local-dev defaults; Docker/GCP override these via SPRING_DATASOURCE_* environment variables
spring.datasource.url=jdbc:postgresql://localhost:5432/rockdb
spring.datasource.username=rockuser
spring.datasource.password=rockpass

# Schema is owned by Flyway (src/main/resources/db/migration)
# validate: fail at startup if entities and the Flyway schema disagree
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# GitHub Pages repo for full-size photos and the published site.
# The token comes from the GITHUB_TOKEN env var (.env locally, Secret Manager on GCP) - never put it here.
rockcollection.github.token=${GITHUB_TOKEN:}
rockcollection.github.repo=${GITHUB_PAGES_REPO:diantris/rock-collection-page}
rockcollection.github.branch=${GITHUB_PAGES_BRANCH:main}
# GitHub REST API; only overridden in tests
rockcollection.github.api-url=https://api.github.com

# Phone photos are often 5-15 MB; several can be uploaded at once
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=400MB

# Browser origins allowed to call the API (comma-separated): the frontend's address
rockcollection.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Sized for a small VM (1 GB RAM, a quarter of a CPU) used by two people: few threads and connections
server.tomcat.threads.max=20
spring.datasource.hikari.maximum-pool-size=4
# Outgoing traffic is limited (1 GB a month on the GCP free tier); JSON compresses to a fraction
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
