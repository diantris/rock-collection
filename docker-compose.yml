services:
  db:
    image: postgres:18
    container_name: rockcollection-db
    restart: unless-stopped # start again with Docker Desktop, unless stopped by hand
    environment:
      POSTGRES_DB: rockdb
      POSTGRES_USER: rockuser
      POSTGRES_PASSWORD: rockpass
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ keeps its data in a version-specific subdirectory of /var/lib/postgresql
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockuser -d rockdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./rock-collection-backend
    container_name: rockcollection-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rockdb
      SPRING_DATASOURCE_USERNAME: rockuser
      SPRING_DATASOURCE_PASSWORD: rockpass
      # From .env (gitignored, see .env.example)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_PAGES_REPO: ${GITHUB_PAGES_REPO:-diantris/rock-collection-page}
      GITHUB_PAGES_BRANCH: ${GITHUB_PAGES_BRANCH:-main}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    # The app's files served by Caddy, which passes /api/* on to the api service (one address for the browser)
    build: ./rock-collection-frontend
    container_name: rockcollection-frontend
    ports:
      - "3000:80"
    environment:
      # Where Caddy finds the API; scenario 3 below points it at one running outside Docker
      API_UPSTREAM: ${API_UPSTREAM:-api:8080}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:

# Usage scenarios:
# 1. All in containers:            docker compose up --build
# 2. DB + backend in containers:   docker compose up db api      (then: yarn dev in rock-collection-frontend)
# 3. DB + frontend in containers:  API_UPSTREAM=host.docker.internal:8080 docker compose up db frontend
#                                  (then: ./mvnw spring-boot:run in rock-collection-backend)
# 4. Only DB in a container:       docker compose up db          (then run backend and frontend locally)
