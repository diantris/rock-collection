services:
  db:
    image: postgres:18
    container_name: rockcollection-db
    environment:
      POSTGRES_DB: rockdb
      POSTGRES_USER: rockuser
      POSTGRES_PASSWORD: rockpass
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ keeps its data in a version-specific subdirectory of /var/lib/postgresql
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockuser -d rockdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./rock-collection-backend
    container_name: rockcollection-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rockdb
      SPRING_DATASOURCE_USERNAME: rockuser
      SPRING_DATASOURCE_PASSWORD: rockpass
    ports:
      - "8080:8080"
    restart: on-failure

  frontend:
    build:
      context: ./rock-collection-frontend
      args:
        # Inlined into the browser bundle at build time; must be reachable from the browser
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: rockcollection-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: on-failure

volumes:
  db_data:

# Usage scenarios:
# 1. All in containers:            docker compose up --build
# 2. DB + backend in containers:   docker compose up db api      (then: yarn dev in rock-collection-frontend)
# 3. DB + frontend in containers:  docker compose up db frontend (then: ./mvnw spring-boot:run in rock-collection-backend)
# 4. Only DB in a container:       docker compose up db          (then run backend and frontend locally)
